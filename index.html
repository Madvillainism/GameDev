<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>The whole idea</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='30' ry='28' fill='none' stroke='%23222' stroke-width='5'/%3E%3Cellipse cx='32' cy='31' rx='22' ry='20' fill='none' stroke='%23777' stroke-width='3'/%3E%3Cellipse cx='32' cy='31' rx='18' ry='16' fill='%23555'/%3E%3Cline x1='32' y1='15' x2='30' y2='31' stroke='%23999' stroke-width='2.5'/%3E%3Cline x1='32' y1='47' x2='34' y2='31' stroke='%23999' stroke-width='2.5'/%3E%3Cline x1='14' y1='31' x2='32' y2='29' stroke='%23999' stroke-width='2.5'/%3E%3Cline x1='50' y1='31' x2='32' y2='33' stroke='%23999' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='31' r='5' fill='%23aaa'/%3E%3Cpath d='M 14 14 L 18 18' stroke='%23e44' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  </head>
  <body>
    <div class="title-screen" id="title-screen">
      <h1>The whole idea</h1>
      <button onclick="goSelect()" class="play-button">Fall into place</button>
      <button onclick="goInstructions()" class="instructions-button" id="instructions-button">How to play</button>
      <h5>Made with love 愛</h5>
    </div>
    <dialog class="how-to" id="how-to">
      <div class="how-to-text">
        <h2>How to Play</h2>
        <div class="how-to-row"><span class="key">⬆</span> Accelerate</div>
        <div class="how-to-row"><span class="key">⬇</span> Brake</div>
        <div class="how-to-row"><span class="key">⬅ ➡</span> Steer</div>
        <p class="how-to-note">Get crazy, crash into holes!</p>
        <button id="close-instructions">Got it</button>
      </div>
    </dialog>

    <div id="carousel" class="carousel slide">
      <h1>GARAGE</h1>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./redcar.png" class="d-block car-img" alt="Red Car">
          <h2>Carro rojo de Ramon</h2>
          <div class="car-stats">
            <div class="stat-row"><span>Speed</span><div class="stat-bar"><div class="stat-fill" style="width: 67%"></div></div></div>
            <div class="stat-row"><span>Accel</span><div class="stat-bar"><div class="stat-fill" style="width: 67%"></div></div></div>
            <div class="stat-row"><span>Turn</span><div class="stat-bar"><div class="stat-fill" style="width: 50%"></div></div></div>
          </div>
          <button class="select-button" onclick="startGame('redCar')">Select</button>
        </div>

        <div class="carousel-item">
          <img src="./A.png" class="d-block car-img" alt="Altheus">
          <h2>Altheus</h2>
          <div class="car-stats">
            <div class="stat-row"><span>Speed</span><div class="stat-bar"><div class="stat-fill" style="width: 83%"></div></div></div>
            <div class="stat-row"><span>Accel</span><div class="stat-bar"><div class="stat-fill" style="width: 83%"></div></div></div>
            <div class="stat-row"><span>Turn</span><div class="stat-bar"><div class="stat-fill" style="width: 60%"></div></div></div>
          </div>
          <button class="select-button" onclick="startGame('altheus')">Select</button>
        </div>

        <div class="carousel-item">
          <img src="./matiz.png" class="d-block car-img" alt="Matiz">
          <h2>Matiz Bumblebee</h2>
          <div class="car-stats">
            <div class="stat-row"><span>Speed</span><div class="stat-bar"><div class="stat-fill" style="width: 50%"></div></div></div>
            <div class="stat-row"><span>Accel</span><div class="stat-bar"><div class="stat-fill" style="width: 50%"></div></div></div>
            <div class="stat-row"><span>Turn</span><div class="stat-bar"><div class="stat-fill" style="width: 75%"></div></div></div>
          </div>
          <button class="select-button" onclick="startGame('matiz')">Select</button>
        </div>

        <div class="carousel-item">
          <img src="./moto.png" class="d-block car-img" alt="Moto">
          <h2>La Motora</h2>
          <div class="car-stats">
            <div class="stat-row"><span>Speed</span><div class="stat-bar"><div class="stat-fill" style="width: 100%"></div></div></div>
            <div class="stat-row"><span>Accel</span><div class="stat-bar"><div class="stat-fill" style="width: 100%"></div></div></div>
            <div class="stat-row"><span>Turn</span><div class="stat-bar"><div class="stat-fill" style="width: 100%"></div></div></div>
          </div>
          <button class="select-button" onclick="startGame('moto')">Select</button>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon arrow" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
        <span class="carousel-control-next-icon arrow" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

      <button class="back-button" id="back-button" onclick="backToTitle()">&#8592; Back</button>
    </div>

    <div id="game-wrapper">
      <canvas id="myCanvas" width="400" height="800"></canvas>

      <div id="touch-controls">
        <div class="touch-row">
          <button class="touch-btn" id="btn-left">&#9664;</button>
          <button class="touch-btn" id="btn-up">GAS &#11014;</button>
          <button class="touch-btn" id="btn-right">&#9654;</button>
        </div>
        <div class="touch-row">
          <button class="touch-btn" id="btn-pause">&#9208;</button>
          <button class="touch-btn" id="btn-down">FRENO &#11015;</button>
        </div>
      </div>

      <div id="game-over-overlay">
        <h2 id="game-over-title">GAME OVER</h2>
        <p id="game-over-score"></p>
        <p id="game-over-highscore"></p>
        <button id="game-over-restart">Restart</button>
      </div>
    </div>

    <script src="events.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  </body>
</html>
